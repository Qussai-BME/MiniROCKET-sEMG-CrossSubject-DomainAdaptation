[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minirocket-semg-domain-adaptation"
version = "2.0.0"
description = "MiniROCKET cross-subject sEMG classification with domain adaptation — LOSO benchmark on NinaPro DB2/DB3/DB7"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Qussai Adlbi", email = "qussai.adlbi@au.edu.sy"},
]
keywords = ["emg", "semg", "minirocket", "domain-adaptation", "coral", "cross-subject", "loso"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "h5py>=3.0.0",
    "pandas>=1.3.0",
    "tqdm>=4.62.0",
    "statsmodels>=0.13.0",
    "sktime>=0.20.0",
    "numba>=0.57.0",
]

[project.urls]
Repository = "https://github.com/Qussai-BME/MiniROCKET-sEMG-CrossSubject-DomainAdaptation"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
# This repo is a flat collection of pipeline scripts plus a small shared
# library (config.py, data_loader.py, minirocket.py, domain_adaptation.py,
# statistical_utils.py), not a nested package -- so setuptools' automatic
# discovery is told explicitly what belongs to the installable package.
# Without this, discovery fails outright: it finds outputs/, logs/, and
# dev_history/ sitting at the same level as the .py files and refuses to
# guess which of them is "the package" (confirmed by testing `pip install
# -e .` before adding this section).
py-modules = [
    "config",
    "data_loader",
    "minirocket",
    "domain_adaptation",
    "statistical_utils",
    "p01a_run_main_loso_benchmark",
    "p01b_run_within_subject_baseline",
    "p02_run_window_and_sample_ablation",
    "p03a_bridge_result_filenames",
    "p03b_clean_stale_kernel_importance_files",
    "p04a_extract_kernel_importance_data",
    "p04b_compute_domain_shift_metrics",
    "p04c_run_coral_distortion_diagnostic",
    "p05_analyze_kernel_importance",
    "p06_run_statistical_analysis",
    "p06b_verify_and_clean_perclass_f1_table",
    "p07_generate_all_figures",
    "feature_extractors",
    "subject_split",
    "optimized_pipeline",
    "p08_run_multiseed_sweep",
    "p10_run_sensitivity_analysis",
]
packages = ["tools", "dev_history"]
